    <feOffset in="blur" dx="0" dy="1.1" result="offsetBlur"/>
    <feFlood flood-color="#06B6D4" flood-opacity="0.30" result="shadowColor"/>
    <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
