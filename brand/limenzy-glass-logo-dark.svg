    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.52" stop-color="#E0F2FE"/>
    <stop offset="1" stop-color="#C7D2FE"/>
  </linearGradient>
  <linearGradient id="limenzyAccent" x1="14" y1="3" x2="47" y2="40" gradientUnits="userSpaceOnUse">
